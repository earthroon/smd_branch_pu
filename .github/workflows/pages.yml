name: SMD Public Static Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages
        env:
          GITHUB_PAGES: '1'
          NUXT_APP_BASE_URL: '/smd_branch_pu/'
          NUXT_PUBLIC_STANDALONE_MEDIA_MODE: 'local'
        run: npm run build

      - name: Validate output
        shell: bash
        run: |
          test -f .output/public/index.html
          # Byte-identical public assets must accompany prerendered HTML.
          while IFS= read -r -d '' source; do
            target=".output/public/${source#public/}"
            test -f "$target" || { echo "::error file=$source::ASSET_MISSING"; exit 1; }
            cmp -s "$source" "$target" || { echo "::error file=$source::ASSET_DRIFT"; exit 1; }
          done < <(find public -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.svg' -o -iname '*.webp' -o -iname '*.avif' \) -print0)
          # Check DOM image references do not accidentally escape the repository base.
          python3 - <<'PY'
          from pathlib import Path
          import re
          broken = []
          root = Path('.output/public')
          for page in root.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if re.search(r'''(?:src|href)=["']/((?:media|about|curriculum|figma|figma-r2)/)''', text):
                  broken.append(str(page))
          if broken:
              raise SystemExit('PUBLIC_ASSET_BASE_MISSING: ' + ', '.join(broken))
          PY
          touch .output/public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4